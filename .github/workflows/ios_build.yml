# =============================================================================
#  Blind Quran App — iOS Flutter build / sign / distribute
# =============================================================================
#  Why this file exists
#  --------------------
#  Development happens in an LXD container on a Linux VPS (remote.futrx), driven
#  from a phone. That container cannot run Xcode, cannot codesign, and cannot
#  produce an .ipa. This workflow is the *only* place where Apple toolchain work
#  happens: the container's job ends at `git push`.
#
#  Cost model (matters — macOS runners bill at 10x on private repos):
#    job `verify`  → ubuntu-latest  (1x)  analyze + unit/widget tests
#    job `build`   → macos-15      (10x)  compile, sign, export, upload
#  `verify` gates `build`, so a Dart typo never burns macOS minutes.
#
#  Distribution channels
#    testflight  → App Store Connect / TestFlight  (needs an App Store profile)
#    firebase    → Firebase App Distribution       (needs an Ad Hoc profile)
#    diawi       → Diawi one-tap install link      (needs an Ad Hoc profile)
#    artifact    → .ipa uploaded to the run only, no external service
#
#  IMPORTANT: TestFlight and Ad Hoc require *different* provisioning profiles.
#  Ad Hoc profiles embed a fixed UDID list; a new test device means regenerating
#  and re-uploading PROVISIONING_PROFILE_ADHOC_BASE64. TestFlight has no such
#  limit, which is why it is the default for daily work.
#
#  Required secrets are documented in REMOTE_IOS_DEV_PLAYBOOK.md §6.
# =============================================================================

name: iOS Build & Distribute

on:
  push:
    branches:
      - main
      - 'feat/ios-**'
      - 'chore/ios-**'
    paths:
      - 'flutter_app/**'
      - '.github/workflows/ios_build.yml'
    tags:
      - 'ios-v*'
  workflow_dispatch:
    inputs:
      distribution:
        description: 'Where to send the build'
        required: true
        default: 'testflight'
        type: choice
        options:
          - testflight
          - firebase
          - diawi
          - artifact
      skip_tests:
        description: 'Skip analyze + tests (emergency only)'
        required: false
        default: false
        type: boolean
      release_notes:
        description: 'Tester-facing notes (defaults to the commit subject)'
        required: false
        type: string

# One build per branch. A second push cancels the first — on a phone workflow you
# always want the newest code on the device, never a queue of stale builds.
concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Root of the Flutter project inside this repository.
  APP_DIR: flutter_app
  FLUTTER_VERSION: '3.35.5'
  FLUTTER_CHANNEL: stable
  XCODE_VERSION: '16.2'
  # Must match PRODUCT_BUNDLE_IDENTIFIER in ios/Runner.xcodeproj. The build job
  # asserts this rather than mutating the project, so a mismatch fails loudly.
  BUNDLE_ID: com.aistudio.quranblind.a11y

jobs:
  # ---------------------------------------------------------------------------
  # 1. VERIFY — cheap Linux runner. Gates the expensive macOS job.
  # ---------------------------------------------------------------------------
  verify:
    name: Analyze & Test (Linux)
    runs-on: ubuntu-latest
    if: ${{ inputs.skip_tests != true }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Resolve dependencies
        working-directory: ${{ env.APP_DIR }}
        run: flutter pub get

      - name: Verify formatting
        working-directory: ${{ env.APP_DIR }}
        run: dart format --output=none --set-exit-if-changed .

      - name: Static analysis
        working-directory: ${{ env.APP_DIR }}
        run: flutter analyze --fatal-infos --fatal-warnings

      # Includes the accessibility invariant tests from
      # ACCESSIBILITY_GUIDELINES_IOS.md §9.1 (I2 single-node, RTL scroll
      # direction, I4 ghost-resume window). These are the regressions that are
      # invisible on a screenshot and expensive to find on device.
      - name: Unit & widget tests
        working-directory: ${{ env.APP_DIR }}
        run: flutter test --reporter=github --coverage

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: ${{ env.APP_DIR }}/coverage/lcov.info
          if-no-files-found: ignore
          retention-days: 7

  # ---------------------------------------------------------------------------
  # 2. BUILD — macOS runner. Compile, sign, export, distribute.
  # ---------------------------------------------------------------------------
  build:
    name: Build & Distribute (macOS)
    runs-on: macos-15
    needs: [verify]
    # `always()` so an intentional skip_tests run still builds, while a genuine
    # test failure still blocks.
    if: ${{ always() && (needs.verify.result == 'success' || inputs.skip_tests == true) }}
    timeout-minutes: 60

    env:
      DISTRIBUTION: ${{ inputs.distribution || 'testflight' }}
      # Mirrored into env because the `secrets` context is NOT available in
      # step-level `if:` conditions.
      NOTIFY_WEBHOOK: ${{ secrets.NOTIFY_WEBHOOK_URL }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # build-name derivation needs history

      # -- Toolchain ---------------------------------------------------------
      - name: Select Xcode ${{ env.XCODE_VERSION }}
        run: |
          sudo xcode-select -s "/Applications/Xcode_${XCODE_VERSION}.app/Contents/Developer"
          xcodebuild -version

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true
          cache-key: flutter-macos-${{ env.FLUTTER_VERSION }}

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.APP_DIR }}/ios/Pods
            ~/.cocoapods
          key: pods-${{ runner.os }}-${{ hashFiles(format('{0}/ios/Podfile.lock', env.APP_DIR)) }}
          restore-keys: pods-${{ runner.os }}-

      - name: Resolve dependencies
        working-directory: ${{ env.APP_DIR }}
        run: |
          flutter pub get
          flutter precache --ios

      # -- Version derivation -------------------------------------------------
      # pubspec `version: 1.0.0+1` supplies the marketing version. The build
      # number comes from run_number so it is strictly monotonic: App Store
      # Connect rejects a duplicate (version, build) pair permanently.
      - name: Derive version and build number
        id: version
        working-directory: ${{ env.APP_DIR }}
        run: |
          set -euo pipefail
          BUILD_NAME="$(grep -m1 '^version:' pubspec.yaml | sed -E 's/version:[[:space:]]*([^+]+).*/\1/' | tr -d '[:space:]')"
          BUILD_NUMBER="${GITHUB_RUN_NUMBER}"
          if [ -z "$BUILD_NAME" ]; then
            echo '::error::Could not parse the version: key from pubspec.yaml'
            exit 1
          fi
          echo "build_name=${BUILD_NAME}"     >> "$GITHUB_OUTPUT"
          echo "build_number=${BUILD_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${GITHUB_SHA:0:7}"  >> "$GITHUB_OUTPUT"
          echo "Building ${BUILD_NAME} (${BUILD_NUMBER})"

      - name: Assert bundle identifier matches ${{ env.BUNDLE_ID }}
        working-directory: ${{ env.APP_DIR }}/ios
        run: |
          set -euo pipefail
          FOUND="$(grep -m1 -o 'PRODUCT_BUNDLE_IDENTIFIER = [^;]*' Runner.xcodeproj/project.pbxproj | head -1 | sed 's/.*= //' | tr -d '"[:space:]')"
          if [ "$FOUND" != "${BUNDLE_ID}" ]; then
            echo "::error::Bundle id mismatch. project.pbxproj has '${FOUND}', workflow expects '${BUNDLE_ID}'."
            echo "Fix it in Xcode (or ios/Flutter/*.xcconfig) — this workflow will not rewrite project files."
            exit 1
          fi
          echo "Bundle id OK: ${FOUND}"

      # -- Code signing material ---------------------------------------------
      # Done inline rather than via a third-party action: signing secrets are the
      # crown jewels, and this keeps the trust boundary at GitHub + Apple only.
      - name: Install signing certificate and provisioning profile
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          PROFILE_APPSTORE: ${{ secrets.PROVISIONING_PROFILE_APPSTORE_BASE64 }}
          PROFILE_ADHOC: ${{ secrets.PROVISIONING_PROFILE_ADHOC_BASE64 }}
        run: |
          set -euo pipefail

          CERT_PATH="$RUNNER_TEMP/signing.p12"
          PROFILE_PATH="$RUNNER_TEMP/build_pp.mobileprovision"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"

          if [ -z "${BUILD_CERTIFICATE_BASE64}" ]; then
            echo "::error::Secret BUILD_CERTIFICATE_BASE64 is empty. See REMOTE_IOS_DEV_PLAYBOOK.md section 6."
            exit 1
          fi

          # TestFlight needs an App Store profile; Diawi/Firebase need Ad Hoc.
          if [ "${DISTRIBUTION}" = "testflight" ] || [ "${DISTRIBUTION}" = "artifact" ]; then
            SELECTED_PROFILE="${PROFILE_APPSTORE}"
            PROFILE_KIND="App Store"
          else
            SELECTED_PROFILE="${PROFILE_ADHOC}"
            PROFILE_KIND="Ad Hoc"
          fi
          if [ -z "${SELECTED_PROFILE}" ]; then
            echo "::error::No ${PROFILE_KIND} provisioning profile secret set for distribution='${DISTRIBUTION}'."
            exit 1
          fi

          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o "$CERT_PATH"
          echo -n "$SELECTED_PROFILE"         | base64 --decode -o "$PROFILE_PATH"

          # Dedicated ephemeral keychain — never touch the runner's login keychain.
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          security import "$CERT_PATH" \
            -P "$P12_PASSWORD" \
            -A -t cert -f pkcs12 \
            -k "$KEYCHAIN_PATH"

          # Lets codesign use the key without an interactive prompt.
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" >/dev/null

          security list-keychain -d user -s "$KEYCHAIN_PATH" login.keychain

          # Extract the profile's UUID and install under the name Xcode expects.
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          PLIST="$RUNNER_TEMP/profile.plist"
          security cms -D -i "$PROFILE_PATH" > "$PLIST"
          PROFILE_UUID="$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$PLIST")"
          PROFILE_NAME="$(/usr/libexec/PlistBuddy -c 'Print :Name' "$PLIST")"
          cp "$PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/${PROFILE_UUID}.mobileprovision"

          echo "PROFILE_UUID=${PROFILE_UUID}" >> "$GITHUB_ENV"
          echo "PROFILE_NAME=${PROFILE_NAME}" >> "$GITHUB_ENV"
          echo "Installed ${PROFILE_KIND} profile '${PROFILE_NAME}' (${PROFILE_UUID})"

          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

      # -- Export compliance --------------------------------------------------
      # The app talks to https://api.alquran.cloud and the recitation CDN over
      # TLS only, and ships no bespoke cryptography — that is the "exempt" case
      # under US EAR 740.17(b). Declaring it here stops App Store Connect from
      # blocking every single TestFlight build behind a manual questionnaire,
      # which would otherwise defeat the whole phone-driven workflow.
      - name: Declare export compliance in Info.plist
        working-directory: ${{ env.APP_DIR }}/ios/Runner
        run: |
          set -euo pipefail
          /usr/libexec/PlistBuddy -c \
            "Add :ITSAppUsesNonExemptEncryption bool false" Info.plist 2>/dev/null || \
          /usr/libexec/PlistBuddy -c \
            "Set :ITSAppUsesNonExemptEncryption false" Info.plist
          /usr/libexec/PlistBuddy -c "Print :ITSAppUsesNonExemptEncryption" Info.plist

      - name: Verify background-audio entitlement
        working-directory: ${{ env.APP_DIR }}/ios/Runner
        run: |
          set -euo pipefail
          # Recitation must keep playing with the screen locked; without this key
          # iOS suspends the app and the audio dies mid-ayah.
          if ! /usr/libexec/PlistBuddy -c "Print :UIBackgroundModes" Info.plist 2>/dev/null | grep -q audio; then
            echo "::error::UIBackgroundModes is missing 'audio'. Background recitation would be killed by iOS."
            exit 1
          fi
          echo "Background audio mode present."

      # -- Build --------------------------------------------------------------
      - name: Generate ExportOptions.plist
        working-directory: ${{ env.APP_DIR }}/ios
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          if [ "${DISTRIBUTION}" = "testflight" ] || [ "${DISTRIBUTION}" = "artifact" ]; then
            METHOD="app-store-connect"
          else
            METHOD="release-testing"   # Xcode 15.4+ name for ad-hoc
          fi

          cat > ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>                       <string>${METHOD}</string>
            <key>teamID</key>                       <string>${APPLE_TEAM_ID}</string>
            <key>signingStyle</key>                 <string>manual</string>
            <key>stripSwiftSymbols</key>            <true/>
            <key>compileBitcode</key>               <false/>
            <key>uploadSymbols</key>                <true/>
            <key>destination</key>                  <string>export</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>${BUNDLE_ID}</key>               <string>${PROFILE_NAME}</string>
            </dict>
          </dict>
          </plist>
          PLIST

          echo "--- ExportOptions.plist ---"
          cat ExportOptions.plist

      - name: Build signed IPA
        working-directory: ${{ env.APP_DIR }}
        run: |
          set -euo pipefail
          flutter build ipa \
            --release \
            --build-name="${{ steps.version.outputs.build_name }}" \
            --build-number="${{ steps.version.outputs.build_number }}" \
            --export-options-plist=ios/ExportOptions.plist \
            --dart-define=BASE_URL=https://api.alquran.cloud/v1/

      - name: Locate and verify the IPA
        id: ipa
        working-directory: ${{ env.APP_DIR }}
        run: |
          set -euo pipefail
          IPA_PATH="$(find build/ios/ipa -maxdepth 1 -name '*.ipa' | head -1)"
          if [ -z "$IPA_PATH" ]; then
            echo "::error::No .ipa produced. Check the Xcode archive step above."
            exit 1
          fi
          ABS_IPA="$(cd "$(dirname "$IPA_PATH")" && pwd)/$(basename "$IPA_PATH")"
          SIZE_MB="$(( $(stat -f%z "$ABS_IPA") / 1024 / 1024 ))"
          echo "path=${ABS_IPA}"    >> "$GITHUB_OUTPUT"
          echo "size_mb=${SIZE_MB}" >> "$GITHUB_OUTPUT"
          echo "Built ${ABS_IPA} (${SIZE_MB} MB)"

          # Confirm the archive really is signed; an unsigned .ipa fails on
          # device with a bare "Unable to Install" and no diagnostics.
          unzip -q -o "$ABS_IPA" -d "$RUNNER_TEMP/ipa_check"
          APP_BUNDLE="$(find "$RUNNER_TEMP/ipa_check/Payload" -maxdepth 1 -name '*.app' | head -1)"
          codesign --verify --deep --strict --verbose=2 "$APP_BUNDLE"
          codesign -d --entitlements :- "$APP_BUNDLE" | head -40

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: quran-blind-ios-${{ steps.version.outputs.build_name }}-${{ steps.version.outputs.build_number }}
          path: ${{ steps.ipa.outputs.path }}
          retention-days: 14
          if-no-files-found: error

      # -- Distribution: TestFlight -------------------------------------------
      - name: Install App Store Connect API key
        if: env.DISTRIBUTION == 'testflight'
        env:
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          # altool looks the key up by ID in this exact directory.
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          printf '%s' "$APPSTORE_PRIVATE_KEY" > "$HOME/.appstoreconnect/private_keys/AuthKey_${APPSTORE_KEY_ID}.p8"
          chmod 600 "$HOME/.appstoreconnect/private_keys/AuthKey_${APPSTORE_KEY_ID}.p8"

      - name: Validate with App Store Connect
        if: env.DISTRIBUTION == 'testflight'
        env:
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
        run: |
          set -euo pipefail
          # Validating first turns a 10-minute upload + rejection into a fast fail.
          xcrun altool --validate-app \
            --type ios \
            --file "${{ steps.ipa.outputs.path }}" \
            --apiKey "$APPSTORE_KEY_ID" \
            --apiIssuer "$APPSTORE_ISSUER_ID"

      - name: Upload to TestFlight
        if: env.DISTRIBUTION == 'testflight'
        env:
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
        run: |
          set -euo pipefail
          xcrun altool --upload-app \
            --type ios \
            --file "${{ steps.ipa.outputs.path }}" \
            --apiKey "$APPSTORE_KEY_ID" \
            --apiIssuer "$APPSTORE_ISSUER_ID"

      # -- Distribution: Firebase App Distribution ----------------------------
      - name: Upload to Firebase App Distribution
        if: env.DISTRIBUTION == 'firebase'
        env:
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          FIREBASE_TESTER_GROUPS: ${{ vars.FIREBASE_TESTER_GROUPS || 'blind-testers' }}
          NOTES: ${{ inputs.release_notes || github.event.head_commit.message }}
        run: |
          set -euo pipefail
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/firebase-sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase-sa.json"
          curl -sL https://firebase.tools | bash
          firebase appdistribution:distribute "${{ steps.ipa.outputs.path }}" \
            --app "$FIREBASE_APP_ID" \
            --groups "$FIREBASE_TESTER_GROUPS" \
            --release-notes "${NOTES}"
          rm -f "$RUNNER_TEMP/firebase-sa.json"

      # -- Distribution: Diawi -------------------------------------------------
      - name: Upload to Diawi
        id: diawi
        if: env.DISTRIBUTION == 'diawi'
        env:
          DIAWI_TOKEN: ${{ secrets.DIAWI_TOKEN }}
          NOTES: ${{ inputs.release_notes || github.event.head_commit.message }}
        run: |
          set -euo pipefail
          JOB="$(curl -s https://upload.diawi.com/ \
            -F token="$DIAWI_TOKEN" \
            -F file=@"${{ steps.ipa.outputs.path }}" \
            -F comment="${NOTES}" \
            -F find_by_udid=0 -F wall_of_apps=0 \
            | python3 -c 'import sys,json; print(json.load(sys.stdin)["job"])')"

          # Diawi processes asynchronously; poll until it resolves.
          for i in $(seq 1 40); do
            sleep 6
            RESP="$(curl -s "https://upload.diawi.com/status?token=${DIAWI_TOKEN}&job=${JOB}")"
            STATUS="$(echo "$RESP" | python3 -c 'import sys,json; print(json.load(sys.stdin).get("status"))')"
            if [ "$STATUS" = "2000" ]; then
              LINK="$(echo "$RESP" | python3 -c 'import sys,json; print(json.load(sys.stdin)["link"])')"
              echo "link=${LINK}" >> "$GITHUB_OUTPUT"
              echo "Install link: ${LINK}"
              exit 0
            elif [ "$STATUS" = "4000" ] || [ "$STATUS" = "4002" ]; then
              echo "::error::Diawi rejected the build: $RESP"
              exit 1
            fi
            echo "Diawi still processing (status=${STATUS}), attempt ${i}/40"
          done
          echo "::error::Diawi did not finish within 4 minutes."
          exit 1

      # -- Reporting: this is what you read on the phone -----------------------
      - name: Write job summary
        if: always()
        run: |
          {
            echo "## iOS build ${{ steps.version.outputs.build_name }} (${{ steps.version.outputs.build_number }})"
            echo ""
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Commit | \`${{ steps.version.outputs.short_sha }}\` |"
            echo "| Branch | \`${{ github.ref_name }}\` |"
            echo "| Channel | \`${DISTRIBUTION}\` |"
            echo "| Bundle id | \`${BUNDLE_ID}\` |"
            echo "| Profile | ${PROFILE_NAME:-n/a} |"
            echo "| IPA size | ${{ steps.ipa.outputs.size_mb }} MB |"
            echo "| Finished | $(date -u +%Y-%m-%dT%H:%M:%SZ) |"
            echo ""
            case "${DISTRIBUTION}" in
              testflight)
                echo "Open **TestFlight** on the iPhone. Processing normally takes 5-15 min after this job goes green." ;;
              diawi)
                echo "Install directly: ${{ steps.diawi.outputs.link }}" ;;
              firebase)
                echo "Check the **Firebase App Distribution** email or the App Tester app." ;;
              artifact)
                echo "Download the \`.ipa\` from this run's Artifacts section." ;;
            esac
            echo ""
            echo "### On-device VoiceOver checks"
            echo "Run the 13-point checklist in \`ACCESSIBILITY_GUIDELINES_IOS.md\` section 9.2 before calling this build good."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Push notification
        if: always() && env.NOTIFY_WEBHOOK != ''
        run: |
          curl -s -X POST "$NOTIFY_WEBHOOK" \
            -H 'Content-Type: application/json' \
            -d "{\"text\":\"iOS build ${{ steps.version.outputs.build_number }} on ${{ github.ref_name }}: ${{ job.status }} (${DISTRIBUTION})\"}" \
            || echo "Webhook failed; not treating as a build failure."

      # -- Always destroy signing material -------------------------------------
      - name: Destroy keychain and profiles
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/app-signing.keychain-db" 2>/dev/null || true
          rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/${PROFILE_UUID:-none}.mobileprovision" 2>/dev/null || true
          rm -rf "$HOME/.appstoreconnect/private_keys" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/signing.p12" "$RUNNER_TEMP/profile.plist" 2>/dev/null || true
