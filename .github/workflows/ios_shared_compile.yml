# =============================================================================
#  Blind Quran App — iOS: compile the :shared Kotlin/Native framework + iosApp
# =============================================================================
#  Why this file exists
#  --------------------
#  Kotlin/Native cannot compile iOS targets on the maintainer's Windows host.
#  This workflow is the ONLY place the iOS side of the KMP programme is ever
#  compiled. It proves three things, in order, and nothing else:
#    1. `:shared` links as SharedKit.framework for the iOS simulator — i.e. all
#       of iosMain (Keychain SecureStore, Darwin Ktor engine, Koin init, the
#       AudioEngine placeholder) actually compiles.
#    2. XcodeGen regenerates the Xcode project from iosApp/project.yml.
#    3. The SwiftUI shell builds for the simulator, unsigned, with the framework
#       embedded by the project.yml pre-build script.
#  No signing, no .ipa, no upload, no secrets. Signing / TestFlight is the
#  Phase 5 workflow (ios_build.yml keeps that plumbing; it is not wired to KMP).
#
#  Cost: macos-15 bills at 10x on private repos. The paths filter keeps it from
#  running on Android-only or docs-only pushes.
# =============================================================================

name: iOS Shared Framework Compile

on:
  push:
    branches:
      - main
      - 'feat/ios-**'
      - 'chore/ios-**'
    paths:
      - 'shared/**'
      - 'iosApp/**'
      - 'gradle/**'
      - 'gradlew'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/ios_shared_compile.yml'
  workflow_dispatch:

# One run per branch; a newer push cancels the older one.
concurrency:
  group: ios-shared-compile-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  compile:
    name: Link SharedKit + build iosApp (macOS)
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      # The wrapper script is tracked from a Windows host; make sure it is executable.
      - name: Make gradlew executable
        run: chmod +x gradlew

      # The runner has ~7 GB RAM. The repo's gradle.properties sizes the daemons for
      # a 16 GB desktop; ~/.gradle/gradle.properties takes precedence and shrinks them.
      - name: Size JVM heaps for the runner
        run: |
          mkdir -p ~/.gradle
          cat >> ~/.gradle/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
          kotlin.daemon.jvmargs=-Xmx1g
          kotlin.native.jvmArgs=-Xmx3g
          org.gradle.workers.max=2
          EOF

      - name: Xcode version
        run: xcodebuild -version

      # -- 1. Kotlin/Native framework -----------------------------------------
      - name: Link SharedKit.framework (iosSimulatorArm64)
        run: ./gradlew :shared:linkDebugFrameworkIosSimulatorArm64 --no-daemon --stacktrace

      - name: Verify the framework binary and its ObjC header
        run: |
          set -euo pipefail
          FW=shared/build/bin/iosSimulatorArm64/debugFramework/SharedKit.framework
          test -d "$FW" || { echo "::error::$FW was not produced"; exit 1; }
          file "$FW/SharedKit"
          ls -la "$FW/Headers"
          # The exported header must mention the iosMain entry points; grep -c exits 1 on zero matches.
          grep -c "initKoinIos" "$FW/Headers/SharedKit.h"
          grep -c "AudioEngine" "$FW/Headers/SharedKit.h"
          grep -c "SecureStore" "$FW/Headers/SharedKit.h"

      # -- 2. Xcode project from project.yml ----------------------------------
      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: iosApp
        run: xcodegen generate

      # -- 3. SwiftUI shell, unsigned, simulator ------------------------------
      # The project.yml pre-build script runs `./gradlew :shared:embedAndSignAppleFrameworkForXcode`
      # inside this xcodebuild; with signing disabled the task copies the framework without signing it.
      - name: Build iosApp for the simulator (unsigned)
        working-directory: iosApp
        run: |
          set -o pipefail
          xcodebuild build \
            -project QuranBlind.xcodeproj \
            -scheme QuranBlind \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            2>&1 | tee "$RUNNER_TEMP/xcodebuild.log" | grep -E "error:|warning:|BUILD |Ld |embedAndSign|SharedKit" || true
          grep -q "BUILD SUCCEEDED" "$RUNNER_TEMP/xcodebuild.log"

      - name: Upload xcodebuild log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-compile-log-${{ github.run_number }}
          path: ${{ runner.temp }}/xcodebuild.log
          if-no-files-found: ignore
          retention-days: 7
